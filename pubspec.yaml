name: taskflow
description: "A beautiful, intuitive personal to-do list app with offline-first architecture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  # Code Generation Support
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # UI/UX
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  flex_color_scheme: ^8.2.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  equatable: ^2.0.7
  dartz: ^0.10.1

  # Biometric (Optional)
  local_auth: ^2.3.0
  shimmer: ^3.0.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  injectable_generator: ^2.7.0

  # Testing
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
